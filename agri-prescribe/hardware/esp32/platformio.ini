; ═══════════════════════════════════════════════════════════════
; AgriPrescribe — ESP32 PlatformIO Project Configuration
; ═══════════════════════════════════════════════════════════════
; Usage:
;   pio run              → build
;   pio run --target upload   → flash to board
;   pio device monitor   → serial monitor (115200 baud)
;
; All library dependencies are installed automatically by PlatformIO.
; No manual library installation needed.
; ═══════════════════════════════════════════════════════════════

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Compiler settings
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32_DEV

; Serial upload speed
upload_speed = 921600

; Serial monitor baud rate
monitor_speed = 115200

; Required libraries (installed automatically)
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
    madhephaestus/ESP32Servo @ ^0.13.0

; Serial monitor filters
monitor_filters =
    esp32_exception_decoder
    time

; Upload port (uncomment and set your port if auto-detect fails)
; upload_port = COM3
; monitor_port = COM3
